# Project: Ink Raiders - game settings (the in-game settings menu, F1, writes controls.ini; this file holds the port's start-up options).
# Paths are relative to this folder: the game files go in exefs\ and romfs\ next to InkRaiders.exe (the start menu puts them there).

[boot]
run_module_init = true

[memory]
limit_gb = 40

[nvn]
# the game's dynamic resolution measures the GPU time: scaled, it settles at one size and render targets are reused
gpu_timestamp_scale = 0.4

[pad]
# off: the right stick is the game's own stick camera (set the game's Options > Motion Controls to OFF). on: the stick fakes a gyro.
stick_gyro = off

[am]
# handheld: the game renders at its handheld resolution (steady 60 fps); docked renders at 3072x1728 and needs far more GPU and memory
operation_mode = handheld
